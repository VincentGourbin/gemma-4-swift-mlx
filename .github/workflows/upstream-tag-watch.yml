# Surveille les tags de mlx-swift-lm tant que Package.swift l'epingle sur une revision
# (issue #67). Des qu'un tag contient la revision epinglee, commente l'issue une fois
# par tag. A supprimer avec l'epinglage.
name: upstream-tag-watch

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  issues: write

env:
  UPSTREAM: ml-explore/mlx-swift-lm
  PINNED: 48114eedf3c3d4a682a6b1d644cc5af5c2945d10
  LAST_KNOWN: 3.32.3
  ISSUE: 67

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Tags amont contenant la revision epinglee
        run: |
          set -euo pipefail
          state=$(gh issue view "$ISSUE" -R "$GITHUB_REPOSITORY" --json state --jq .state)
          if [ "$state" != "OPEN" ]; then echo "Issue #$ISSUE fermee, rien a faire"; exit 0; fi
          comments=$(gh issue view "$ISSUE" -R "$GITHUB_REPOSITORY" --json comments --jq '.comments[].body')
          for tag in $(gh api "repos/$UPSTREAM/tags?per_page=30" --jq '.[].name'); do
            newest=$(printf '%s\n%s\n' "$LAST_KNOWN" "$tag" | sort -V | tail -1)
            if [ "$tag" = "$LAST_KNOWN" ] || [ "$newest" != "$tag" ]; then continue; fi
            cmp=$(gh api "repos/$UPSTREAM/compare/$PINNED...$tag" --jq .status)
            echo "$tag : $cmp"
            case "$cmp" in identical|ahead) ;; *) continue ;; esac
            marker="<!-- upstream-tag:$tag -->"
            if printf '%s' "$comments" | grep -qF "$marker"; then echo "$tag deja signale"; continue; fi
            gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "$marker
          Nouveau tag mlx-swift-lm **$tag** contenant \`${PINNED:0:7}\` : https://github.com/$UPSTREAM/releases/tag/$tag
          Derouler le plan d'action de cette issue."
          done
