# Compilation seulement. Les runners macOS de GitHub ne garantissent pas un GPU
# Metal utilisable par MLX (mlx-swift et mlx-swift-lm testent sur des runners
# auto-heberges) : les tests se lancent sur une machine Apple Silicon avec
# Scripts/run-tests.sh (jamais `xcodebuild test` nu, voir CLAUDE.md).
name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: xcodebuild -version
      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || xcodebuild -showComponent MetalToolchain
      - name: Build library, CLI and test bundle
        run: |
          xcodebuild build-for-testing \
            -scheme Gemma4Swift-Package \
            -destination 'platform=macOS' \
            -derivedDataPath .build/xcode \
            -skipMacroValidation
      - name: Server isolation (consumers never resolve hummingbird / swift-nio)
        run: Scripts/check-server-isolation.sh
      - name: Build and test server package (fake backend, no GPU)
        working-directory: Server
        run: |
          xcodebuild test \
            -scheme Gemma4Server-Package \
            -destination 'platform=macOS' \
            -derivedDataPath ../.build/xcode-server \
            -skipMacroValidation \
            -only-testing:Gemma4ServerTests
